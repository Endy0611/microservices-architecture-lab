server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: dev
  cloud:
    config:
      server:
        git:
          uri: https://github.com/Endy0611/Config_Server_PF.git
          default-label: main
          username: ${GIT_USERNAME}
          password: ${GIT_TOKEN}
          clone-on-start: true

management:
  endpoints:
    web:
      exposure:
        include: health, info